name: Dependabot Auto-merge (Patch Only)

on:
  schedule:
    - cron: '0 10 * * 5'  # Every Friday 19:00 JST (10:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual merge)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read  # statusCheckRollup 内の workflowRun にアクセスするために必要
  statuses: read  # statusCheckRollup.contexts.nodes へのアクセスに必要

env:
  EXCLUDED_PACKAGES: "next,react,react-dom,aws-amplify,@aws-amplify/adapter-nextjs,tailwindcss"
  GH_TOKEN: ${{ github.token }}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Dependabot PRs
        id: get_prs
        run: |
          echo "Fetching Dependabot PRs..."
          gh pr list \
            --search "author:app/dependabot is:open" \
            --json number,title,headRefName \
            --jq '.[] | "\(.number)|\(.title)|\(.headRefName)"' \
            > prs.txt

          PR_COUNT=$(wc -l < prs.txt)
          echo "Found $PR_COUNT Dependabot PRs"
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT

      - name: Filter Patch Version PRs
        id: filter
        run: |
          echo "Filtering patch version PRs..."
          > patch_prs.txt

          while IFS='|' read -r number title branch; do
            # ========== Individual PR Processing ==========
            if [[ $title =~ ^Bump\ (.+)\ from\ ([0-9]+\.[0-9]+\.[0-9]+)\ to\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              PACKAGE_NAME="${BASH_REMATCH[1]}"
              OLD_VERSION="${BASH_REMATCH[2]}"
              NEW_VERSION="${BASH_REMATCH[3]}"

              # Check if excluded package
              if echo "$EXCLUDED_PACKAGES" | grep -q "$PACKAGE_NAME"; then
                echo "⏭️ Skipping excluded package: $PACKAGE_NAME"
                continue
              fi

              # Parse versions
              if [[ $OLD_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                OLD_MAJOR="${BASH_REMATCH[1]}"
                OLD_MINOR="${BASH_REMATCH[2]}"
              fi

              if [[ $NEW_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                NEW_MAJOR="${BASH_REMATCH[1]}"
                NEW_MINOR="${BASH_REMATCH[2]}"
              fi

              # Check if patch version
              if [ "$OLD_MAJOR" = "$NEW_MAJOR" ] && [ "$OLD_MINOR" = "$NEW_MINOR" ]; then
                echo "$number|$title|$branch|individual" >> patch_prs.txt
                echo "✅ Patch PR (Individual): #$number - $title"
              else
                echo "⏭️ Non-patch PR (Individual): #$number - $title"
              fi

            # ========== Group PR Processing ==========
            elif [[ $title =~ ^Bump\ the\ (.+)\ group\ with\ ([0-9]+)\ updates?$ ]]; then
              GROUP_NAME="${BASH_REMATCH[1]}"
              UPDATE_COUNT="${BASH_REMATCH[2]}"

              echo ""
              echo "🔍 Checking group PR: $GROUP_NAME ($UPDATE_COUNT updates)"

              # Check if excluded group
              if [[ "$GROUP_NAME" == "react" ]]; then
                echo "⏭️ Skipping excluded group: $GROUP_NAME"
                continue
              fi

              # Fetch PR body
              echo "Fetching PR body for #$number..."
              BODY=$(gh pr view "$number" --json body --jq '.body' 2>&1)

              if [ $? -ne 0 ]; then
                echo "⚠️ Warning: Failed to fetch PR body for #$number"
                echo "⏭️ Skipping group PR due to API error"
                continue
              fi

              # Parse version information from Markdown table
              ALL_PATCH=true
              CONTAINS_EXCLUDED=false
              PACKAGE_LIST=""
              VERSION_LIST=""

              while IFS= read -r line; do
                # Parse table row: | [package](link) | `1.2.3` | `1.2.4` |
                if [[ $line =~ ^\|\ \[([^\]]+)\].*\|\ \`([0-9]+\.[0-9]+\.[0-9]+)\`\ \|\ \`([0-9]+\.[0-9]+\.[0-9]+)\` ]]; then
                  PKG_NAME="${BASH_REMATCH[1]}"
                  OLD_VER="${BASH_REMATCH[2]}"
                  NEW_VER="${BASH_REMATCH[3]}"

                  PACKAGE_LIST="${PACKAGE_LIST}${PKG_NAME}, "
                  VERSION_LIST="${VERSION_LIST}  - ${PKG_NAME}: ${OLD_VER} → ${NEW_VER}\n"

                  # Check if excluded package
                  if echo "$EXCLUDED_PACKAGES" | grep -qE "(^|,)${PKG_NAME}(,|$)"; then
                    echo "⚠️ Group contains excluded package: $PKG_NAME"
                    CONTAINS_EXCLUDED=true
                    break
                  fi

                  # Check if patch version (major.minor must be same)
                  if [[ $OLD_VER =~ ^([0-9]+)\.([0-9]+)\. ]] && [[ $NEW_VER =~ ^([0-9]+)\.([0-9]+)\. ]]; then
                    OLD_MM="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                    NEW_MM=""

                    if [[ $NEW_VER =~ ^([0-9]+)\.([0-9]+)\. ]]; then
                      NEW_MM="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

                      if [ "$OLD_MM" != "$NEW_MM" ]; then
                        echo "⚠️ Non-patch update detected: $PKG_NAME ($OLD_VER → $NEW_VER)"
                        ALL_PATCH=false
                        break
                      fi
                    fi
                  fi
                fi
              done <<< "$BODY"

              # Check if version information was successfully parsed
              if [ -z "$PACKAGE_LIST" ]; then
                echo "⚠️ Warning: Could not parse versions from PR body"
                echo "⏭️ Skipping group PR due to parsing failure: #$number"
                continue
              fi

              # Determine result
              if [ "$CONTAINS_EXCLUDED" = "true" ]; then
                echo "⏭️ Skipping group PR (contains excluded package): #$number"
              elif [ "$ALL_PATCH" = "true" ]; then
                echo "$number|$title|$branch|group" >> patch_prs.txt
                echo "✅ Patch PR (Group): #$number - $GROUP_NAME group"
                echo "📦 Packages: ${PACKAGE_LIST%, }"
                echo -e "📊 Versions:\n${VERSION_LIST}"
              else
                echo "⏭️ Non-patch PR (Group): #$number - $GROUP_NAME group"
              fi

            # ========== Unknown Format ==========
            else
              echo "⚠️ Unknown PR format: #$number - $title"
            fi
          done < prs.txt

          PATCH_PR_COUNT=$(wc -l < patch_prs.txt 2>/dev/null || echo 0)
          echo "Found $PATCH_PR_COUNT patch version PRs"
          echo "patch_pr_count=$PATCH_PR_COUNT" >> $GITHUB_OUTPUT

      - name: Merge PRs Sequentially
        if: steps.filter.outputs.patch_pr_count > 0
        run: |
          echo "## Dependabot Auto-merge Results" > results.md
          echo "" >> results.md
          echo "| PR | Type | Title | Status | Details |" >> results.md
          echo "|---|---|---|---|---|" >> results.md

          SUCCESS_COUNT=0
          SKIP_COUNT=0
          FAIL_COUNT=0

          while IFS='|' read -r number title branch pr_type; do
            echo ""
            echo "========================================="
            if [ "$pr_type" = "group" ]; then
              echo "Processing Group PR #$number: $title"
            else
              echo "Processing Individual PR #$number: $title"
            fi
            echo "========================================="

            # Set PR Type label for results.md
            PR_TYPE_LABEL=$([ "$pr_type" = "group" ] && echo "Group" || echo "Individual")

            # Check CI status
            echo "Checking CI status..."
            MAX_WAIT=30
            for i in $(seq 1 $MAX_WAIT); do
              STATUS_JSON=$(gh pr view "$number" --json statusCheckRollup)

              # Check if all required checks are successful
              DEPLOY_STATUS=$(echo "$STATUS_JSON" | jq -r '[.statusCheckRollup[] | select(.name == "deploy" or .workflowName == "Deploy to Vercel")] | if length > 0 then (all(.conclusion == "SUCCESS")) else true end')
              VERCEL_STATUS=$(echo "$STATUS_JSON" | jq -r '[.statusCheckRollup[] | select(.context == "Vercel")] | if length > 0 then (all(.state == "SUCCESS")) else true end')
              GITGUARDIAN_STATUS=$(echo "$STATUS_JSON" | jq -r '[.statusCheckRollup[] | select(.name == "GitGuardian Security Checks")] | if length > 0 then (all(.conclusion == "SUCCESS")) else true end')

              if [ "$DEPLOY_STATUS" = "true" ] && [ "$VERCEL_STATUS" = "true" ] && [ "$GITGUARDIAN_STATUS" = "true" ]; then
                echo "✅ All CI checks passed"
                break
              fi

              if [ $i -eq $MAX_WAIT ]; then
                echo "⏭️ Timeout waiting for CI checks - skipping"
                echo "| #$number | $PR_TYPE_LABEL | $title | ⏭️ Skipped | CI timeout |" >> results.md
                SKIP_COUNT=$((SKIP_COUNT + 1))
                continue 2
              fi

              echo "Waiting for CI checks... ($i/$MAX_WAIT)"
              sleep 60
            done

            # Check mergeable status
            MERGEABLE=$(gh pr view "$number" --json mergeable --jq '.mergeable')
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "🔄 Conflicts detected - attempting rebase"
              gh pr comment "$number" --body "@dependabot rebase"
              sleep 30

              MERGEABLE=$(gh pr view "$number" --json mergeable --jq '.mergeable')
              if [ "$MERGEABLE" = "CONFLICTING" ]; then
                echo "⏭️ Conflicts remain - skipping"
                echo "| #$number | $PR_TYPE_LABEL | $title | ⏭️ Skipped | Conflicts |" >> results.md
                SKIP_COUNT=$((SKIP_COUNT + 1))
                continue
              fi
            fi

            # Dry run check
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "🔍 DRY RUN: Would merge PR #$number"
              echo "| #$number | $PR_TYPE_LABEL | $title | 🔍 Dry Run | Would merge |" >> results.md
              continue
            fi

            # Merge PR
            echo "🚀 Merging PR #$number"
            if gh pr merge "$number" --squash --auto --delete-branch; then
              echo "✅ Successfully merged PR #$number"
              echo "| #$number | $PR_TYPE_LABEL | $title | ✅ Merged | Success |" >> results.md
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))

              # Wait for next PR CI to trigger
              sleep 30
            else
              echo "❌ Failed to merge PR #$number"
              echo "| #$number | $PR_TYPE_LABEL | $title | ❌ Failed | Merge error |" >> results.md
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done < patch_prs.txt

          # Generate summary
          echo "" >> results.md
          echo "### Summary" >> results.md
          echo "- ✅ Merged: $SUCCESS_COUNT" >> results.md
          echo "- ⏭️ Skipped: $SKIP_COUNT" >> results.md
          echo "- ❌ Failed: $FAIL_COUNT" >> results.md

          cat results.md >> $GITHUB_STEP_SUMMARY

      - name: No Patch PRs Found
        if: steps.filter.outputs.patch_pr_count == 0
        run: |
          echo "## Dependabot Auto-merge Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No patch version PRs found to merge." >> $GITHUB_STEP_SUMMARY
